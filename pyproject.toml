[project]
name = "safemotion"
version = "0.1.0"
description = "Unofficial pre-flight and safety tools for robot motion, simulation first. No dependencies."
requires-python = ">=3.10"
authors = [{ name = "Ali Amini" }]
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["safemotion"]
